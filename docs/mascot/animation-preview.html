<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tally motion library</title><style>body{background:#0b1426;color:#eef2fa;font:16px system-ui;padding:32px;margin:auto;max-width:900px}main{display:flex;flex-wrap:wrap;gap:40px}.clip{width:var(--size);height:var(--size);overflow:hidden;margin:16px 0}.strip{height:var(--size);width:calc(var(--size)*var(--frames));max-width:none;animation:frames var(--duration) steps(var(--frames)) infinite}button{background:#d4e870;border:0;padding:10px 16px;border-radius:8px;color:#0b1426}body.paused .strip{animation-play-state:paused}@keyframes frames{to{transform:translateX(-100%)}}@media(prefers-reduced-motion:reduce){.strip{animation:none}}</style><h1>Tally motion library</h1><p>Idle, Wave, Working and Success. Preview loops continuously for inspection; the app uses brief reactions and real work only.</p><button onclick="document.body.classList.toggle('paused')">Pause / resume</button><main id="poses"></main><script>const clips={idle:[8,800],wave:[10,833],working:[12,1200],success:[12,1000]};for(const [name,[frames,duration]] of Object.entries(clips)){const section=document.createElement('section');section.innerHTML='<h2>'+name+'</h2>'+[96,56].map(size=>`<div class="clip" style="--size:${size}px;--frames:${frames};--duration:${duration}ms"><img alt="Tally ${name}" class="strip" src="../../public/mascot/tally-cat/animation/${name}.webp"></div>`).join('');document.querySelector('main').append(section)}</script></html>
